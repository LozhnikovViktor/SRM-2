<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SRM Тендеры{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; padding: 20px; }</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
        <div class="container">
            <a class="navbar-brand" href="{% url 'tenders:list' %}">🏢 SRM Тендеры</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-light me-3">👤 {{ user.username }}</span>
                    <a href="{% url 'tenders:add' %}" class="btn btn-sm btn-success me-2">➕ Новый тендер</a>
                    <form method="post" action="{% url 'tenders:logout' %}">{% csrf_token %}
                        <button class="btn btn-sm btn-outline-light">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'tenders:login' %}" class="btn btn-sm btn-outline-light me-2">Войти</a>
                    <a href="{% url 'tenders:register' %}" class="btn btn-sm btn-primary">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
