{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
  <h4 class="mb-3 text-center">📝 Регистрация</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100 mt-2">Создать аккаунт</button>
  </form>
  <div class="mt-3 text-center">
    <a href="{% url 'tenders:login' %}">Уже есть аккаунт? Войти</a>
  </div>
</div>
{% endblock %}
