<div class="comment-item mb-3 p-3 border rounded bg-light" id="comment-{{ comment.id }}">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
            <strong>{{ comment.author.get_full_name|default:comment.author.username }}</strong>
            <small class="text-muted ms-2">
                <i class="bi bi-clock"></i>
                {{ comment.created_at|date:"d.m.Y H:i" }}
                {% if comment.updated_at != comment.created_at %}
                    <span class="badge bg-warning text-dark ms-1">изменён</span>
                {% endif %}
            </small>
        </div>
        {% if comment.author == user %}
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary btn-sm" onclick="editComment({{ comment.id }})">
                <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteComment({{ comment.id }})">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        {% endif %}
    </div>
    <div class="comment-text">
        {{ comment.text|linebreaksbr }}
    </div>
</div>
