{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="mb-3 text-center">🔐 Установите новый пароль</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Сохранить новый пароль</button>
    </form>
</div>
{% endblock %}
