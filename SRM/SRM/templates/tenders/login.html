{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
  <h4 class="mb-3 text-center">🔐 Вход в систему</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
    <div class="mt-3 text-center">
    <a href="{% url 'tenders:password_reset' %}"> Забыли пароль?</a>
</div>
  </form>
  <div class="mt-3 text-center">
    <a href="{% url 'tenders:register' %}">Нет аккаунта? Зарегистрироваться</a>
  </div>
</div>
{% endblock %}
