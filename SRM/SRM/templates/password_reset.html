{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="mb-3 text-center">🔑 Восстановление пароля</h4>
    <p class="text-muted">Введите email, и мы отправим вам ссылку для сброса пароля.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">Email:</label>
            <input type="email" name="email" class="form-control" id="id_email" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">📧 Отправить ссылку</button>
    </form>
    
    <div class="mt-3 text-center">
        <a href="{% url 'tenders:login' %}">← Вернуться к входу</a>
    </div>
</div>
{% endblock %}
