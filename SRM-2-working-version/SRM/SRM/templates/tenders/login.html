{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">🔐 Вход для сотрудников</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a href="{% url 'tenders:client_login' %}" class="btn btn-outline-primary w-100 mb-2">
                        🏢 Вход для клиентов (по ИНН)
                    </a>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{% url 'tenders:password_reset' %}">Забыли пароль?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
