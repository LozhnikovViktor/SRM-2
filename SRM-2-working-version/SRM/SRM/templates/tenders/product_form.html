{% extends "base.html" %}
{% block title %}Добавить продукцию{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4">➕ Добавить продукцию</h2>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Наименование <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Артикул</label>
                    <input type="text" name="article" class="form-control">
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Цена прайс</label>
                        <input type="number" name="price" class="form-control" step="0.01" min="0" value="0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ед. измерения</label>
                        <input type="text" name="unit" class="form-control" value="шт">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">💾 Сохранить</button>
                    <a href="{% url 'tenders:product_list' %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
