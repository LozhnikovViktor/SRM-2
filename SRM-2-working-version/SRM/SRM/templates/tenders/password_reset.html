{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3 text-center">🔑 Восстановление пароля</h4>
            <p class="text-muted">Введите email, привязанный к аккаунту. Мы отправим ссылку для сброса пароля.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email:</label>
                    <input type="email" name="email" class="form-control" id="id_email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">📧 Отправить ссылку</button>
            </form>
            
            <div class="mt-3 text-center">
                <a href="{% url 'tenders:login' %}">← Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
